name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e-playwright:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-build]
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright
        run: |
          npm init -y
          npm install -D @playwright/test@1.49.1
          npx playwright install chromium --with-deps
      - name: Start app
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/agrovenda
          PORT: 3001
          NODE_ENV: production
          DISABLE_AUTH_RATE_LIMIT: '1'
        run: |
          mkdir -p backend/uploads
          # Serve built frontend via backend if configured; else start API + preview
          cd backend && node server.js &
          sleep 3
          cd frontend && npx vite preview --host 0.0.0.0 --port 3000 &
          sleep 5
          curl -sf http://localhost:3001/api/health || true
          curl -sf http://localhost:3000 || true
      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_EMAIL: admin@agrovenda.com.br
          E2E_PASSWORD: Admin123!
        run: npx playwright test
